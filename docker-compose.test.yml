services:
# ─────────────────── infrastructure ───────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "29092:9092"                     # host → container
    environment:
      KAFKA_BROKER_ID:                 1
      KAFKA_ZOOKEEPER_CONNECT:         zookeeper:2181

      # listeners: inside‑cluster (9092) and host‑exposed (29092)
      KAFKA_LISTENERS:                 PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS:      PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    # Wait until the broker actually responds before other services start
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12                        # ≈60 s max

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

# ───────────────────── your code ───────────────────────
  producer:
    build: .
    entrypoint: ["python", "-m", "test.producer_massive"]
    env_file: [.env]
    environment:
      KAFKA_SERVER: kafka
      KAFKA_PORT:   9092
      R_HOST:       redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "7000:7000"        # ← NEW: hostPort:containerPort

  consumer:
    build: .
    entrypoint: ["python", "-m", "test.consumer_massive"]
    env_file: [.env]
    environment:
      KAFKA_SERVER: kafka
      KAFKA_PORT:   9092
      R_HOST:       redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
